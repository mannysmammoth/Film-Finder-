<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
    <script src="https://kit.fontawesome.com/80f1a599ce.js" crossorigin="anonymous"></script>
    <title>Film Finder Search</title>
</head>
<body>
    <header class="top">
        <nav class="inner__nav">
            <ul class="list__items">
                <li class="list">
                    <a class="link link__hover--effect" href="home.html">Home</a>
                </li>
            </ul>
            <h1 class="title">Film Finder<i class="fa-solid fa-film"></i></h1>
            <ul class="list__items">
                <li class="list">
                    <a class="link link__hover--effect" href="search.html">Search</a>
                </li>
            </ul>
        </nav>
    </header>
    <section id="search__page">
        <div class="first__section">
          <h2 class="search__page-title">Take a Look<i class="fa-solid fa-magnifying-glass"></i></h2>
        </div>
        <div class="second__section">  
          <input id="searchQuery" type="text" placeholder="Search for a movie...">
          <button class="search__button" onclick="performSearch()">Search</button>
        </div>
    <!--</section>
    <section id="results__contents">-->
        <div class="results-sorter__conatiner">
          <div class="sorter__div">
            <h2 class="result__header__title">Sort by:</h2>
            <select id="sortOptions" class="filter__selector" onchange="sortResults(this.value)">
                <option value="" disabled selected>Sort</option>
                <option value="movie">Movie</option>
                <option value="tv">TV</option>
                <option value="year__newest_to_oldest">Year, Recent to Older</option>
                <option value="year__oldest_to_newest">Year, Older to Recent</option>
            </select>
          </div>
          <div class="results__div">
            <h2 class="result__header__title">Results:</h2>
          </div>
        </div>
        <div class="results__container">
          <i class="fa-solid fa-arrow-rotate-right loading__icon__animation"></i>
        </div>
    </section>
    <footer>
        <p class="footer__copyright__two">Copyright &copy; 2026 Film Finder. All rights reserved (Emmanuel Corral).</p>
    </footer>
</body>
</html>
